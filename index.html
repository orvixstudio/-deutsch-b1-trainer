const L=[
{p:1,title:'Alltagsgeschichte',text:'Mara bemerkte am Nachmittag, dass ihr Rucksack fehlte. Sie war am Morgen mit dem Bus zur Arbeit gefahren und hatte ihn später im Büro nicht mehr gesehen. Ein Kollege erinnerte sie daran, dass sie ihn während der Mittagspause im kleinen Café neben dem Büro abgestellt hatte. Dort fand die Besitzerin den Rucksack und bewahrte ihn hinter der Theke auf. Mara war erleichtert, denn ihr Laptop und ihre Unterlagen waren noch vollständig.',qs:[['Mara merkte den Verlust erst später am Tag.',[['Richtig','r'],['Falsch','f']],'r'],['Mara war mit dem Zug zur Arbeit gefahren.',[['Richtig','r'],['Falsch','f']],'f'],['Ein Kollege half ihr, sich an das Café zu erinnern.',[['Richtig','r'],['Falsch','f']],'r'],['Der Rucksack wurde im Café gefunden.',[['Richtig','r'],['Falsch','f']],'r'],['Im Rucksack fehlte der Laptop.',[['Richtig','r'],['Falsch','f']],'f'],['Die Besitzerin des Cafés hatte den Rucksack aufgehoben.',[['Richtig','r'],['Falsch','f']],'r']]},
{p:2,title:'Nachhaltige Energie',text:'Die kleine Gemeinde Sonnenfeld hat ihre alte Heizungsanlage ersetzt. Auf mehreren öffentlichen Gebäuden wurden Solarmodule installiert. Zusätzlich nutzt die Gemeinde eine Anlage, die aus organischen Resten Wärme erzeugt. Ein Teil der Energie wird selbst verbraucht, überschüssiger Strom wird ins Netz eingespeist. Die Gemeinde möchte damit langfristig Kosten senken und weniger fossile Brennstoffe benötigen. Für die Bewohner wurden außerdem Informationsabende organisiert.',qs:[['Was ist das Hauptthema des Textes?',[['ein neues Wohngebiet','a'],['Energieversorgung einer Gemeinde','b'],['ein Schulprojekt','c']],'b'],['Was wurde auf öffentlichen Gebäuden installiert?',[['Solarmodule','a'],['Windräder','b'],['neue Fenster','c']],'a'],['Was passiert mit überschüssigem Strom?',[['Er wird gespeichert und nie verwendet.','a'],['Er wird verkauft an die Nachbargemeinde.','b'],['Er wird ins Stromnetz eingespeist.','c']],'c'],['Welches Ziel verfolgt die Gemeinde?',[['mehr fossile Brennstoffe zu nutzen','a'],['Kosten und fossile Energie zu reduzieren','b'],['die Informationsabende abzuschaffen','c']],'b'],['Für wen gibt es Informationsabende?',[['für Bewohner','a'],['nur für Touristen','b'],['nur für Techniker','c']],'a'],['Die Gemeinde nutzt ausschließlich eine einzige Energiequelle.',[['Richtig','r'],['Falsch','f']],'f']]},
{p:3,title:'Anzeige und Informationen',text:'Stadtbibliothek Nord – Neue Öffnungszeiten: Montag bis Freitag 9–19 Uhr, Samstag 10–15 Uhr. Die Rückgabe von Medien ist auch außerhalb der Öffnungszeiten über den Automaten neben dem Haupteingang möglich. Für neue Nutzer gibt es jeden ersten Mittwoch im Monat eine kurze Einführung. Die Teilnahme ist kostenlos, eine Anmeldung ist nicht nötig.',qs:[['Wann ist die Bibliothek am Samstag geöffnet?',[['9–12 Uhr','a'],['10–15 Uhr','b'],['12–19 Uhr','c']],'b'],['Wo können Medien außerhalb der Öffnungszeiten zurückgegeben werden?',[['am Haupteingang','a'],['über einen Automaten','b'],['im Lesesaal','c']],'b'],['Wann findet die Einführung statt?',[['jeden ersten Mittwoch','a'],['jeden Montag','b'],['jeden letzten Samstag','c']],'a'],['Was kostet die Einführung?',[['nichts','a'],['fünf Euro','b'],['die normale Jahresgebühr','c']],'a'],['Muss man sich für die Einführung anmelden?',[['Ja, eine Woche vorher.','a'],['Nein.','b'],['Nur telefonisch.','c']],'b'],['Die Rückgabe außerhalb der Öffnungszeiten ist nicht möglich.',[['Richtig','r'],['Falsch','f']],'f'],['Die Bibliothek öffnet unter der Woche um neun Uhr.',[['Richtig','r'],['Falsch','f']],'r']]},
{p:4,title:'Meinung',text:'Viele Menschen arbeiten heute teilweise von zu Hause. Für Anna bedeutet das weniger Zeit im Berufsverkehr und mehr Ruhe am Morgen. Sie findet jedoch wichtig, regelmäßig ins Büro zu kommen, weil spontane Gespräche mit Kollegen dort leichter entstehen. Ihr Kollege Daniel arbeitet lieber fast vollständig zu Hause. Er sagt, dass er sich dort besser konzentrieren kann. Beide sind sich einig, dass klare Absprachen im Team notwendig sind.',qs:[['Warum gefällt Anna das Arbeiten zu Hause?',[['Sie hat keinen Arbeitsplatz im Büro.','a'],['Sie spart Zeit auf dem Arbeitsweg.','b'],['Sie möchte weniger mit Kollegen sprechen.','c']],'b'],['Was vermisst Anna zu Hause?',[['spontane Gespräche mit Kollegen','a'],['Ruhe am Morgen','b'],['Zeit im Berufsverkehr','c']],'a'],['Warum arbeitet Daniel gern zu Hause?',[['Er kann sich besser konzentrieren.','a'],['Er hat dort mehr Kollegen.','b'],['Er muss keine Aufgaben erledigen.','c']],'a'],['Worüber sind beide einer Meinung?',[['Teams brauchen klare Absprachen.','a'],['Alle sollten im Büro arbeiten.','b'],['Homeoffice ist immer besser.','c']],'a'],['Anna arbeitet ausschließlich von zu Hause.',[['Richtig','r'],['Falsch','f']],'f'],['Daniel bevorzugt einen großen Arbeitsplatz im Büro.',[['Richtig','r'],['Falsch','f']],'f'],['Beide sehen sowohl Vorteile als auch Herausforderungen beim Arbeiten zu Hause.',[['Richtig','r'],['Falsch','f']],'r']]},
{p:5,title:'Kurze Mitteilungen',text:'A: Wegen einer technischen Störung beginnt der Kurs heute erst um 18 Uhr. B: Der Termin beim Zahnarzt wurde auf Dienstag um 11 Uhr verschoben. C: Das Paket kann ab morgen in der Filiale am Bahnhof abgeholt werden. D: Der Elternabend findet nicht im Klassenzimmer, sondern in der Aula statt.',qs:[['Wann beginnt der Kurs?',[['17 Uhr','a'],['18 Uhr','b'],['19 Uhr','c']],'b'],['Wann ist der neue Zahnarzttermin?',[['Montag 11 Uhr','a'],['Dienstag 11 Uhr','b'],['Dienstag 12 Uhr','c']],'b'],['Wo kann das Paket abgeholt werden?',[['am Bahnhof','a'],['bei der Post zu Hause','b'],['im Kurszentrum','c']],'a'],['Wo findet der Elternabend statt?',[['im Klassenzimmer','a'],['in der Aula','b'],['im Büro','c']],'b']]}

function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}function load(k,d){try{var raw=localStorage.getItem(k);return raw===null?d:JSON.parse(raw)}catch(e){return d}}function hist(){return load('b1hist',[])}
function home(){clearInterval(state.timer);app.innerHTML=`<div class="wrap"><section class="card hero"><div class="emoji">🇩🇪</div><h1>Deutsch B1</h1><p>Hören & Lesen Trainer im minimalistischen Design.</p><div class="pillrow"><span class="pill">Hören · 30 Aufgaben · 40 Min.</span><span class="pill">Lesen · 30 Aufgaben · 65 Min.</span></div></section><div class="grid"><button class="btn" onclick="startH()">🎧 HÖREN</button><button class="btn secondary" onclick="startL()">📖 LESEN</button></div><div class="section">Werkzeuge</div><div class="grid"><button class="btn secondary" onclick="training('Hören')">🎯 Hören Training</button><button class="btn secondary" onclick="training('Lesen')">🎯 Lesen Training</button><button class="btn secondary" onclick="results()">📊 Ergebnisse</button><button class="btn secondary" onclick="notes()">📝 Notizen</button></div><div class="section">Letztes Ergebnis</div><div class="card">${lastResult()}</div><div class="notice">Hören: Original-Audio vom Goethe-Institut. Fragen und Antwortoptionen in diesem Trainer sind eigene Formulierungen. Lesen: eigene B1-Texte und Aufgaben im Goethe-orientierten Format.</div></div>`}
function lastResult(){let h=hist();if(!h.length)return '<span class="muted">Noch keine Versuche.</span>';let x=h[0];return `<b>${x.module}</b><br><span class="muted">${x.score}/${x.total} · ${Math.round(x.score/x.total*100)}% · ${new Date(x.date).toLocaleString('de-DE')}</span>`}
function top(title,sub){return `<div class="top"><button onclick="home()">←</button><div class="brand">${title}<small>${sub||''}</small></div><button onclick="home()">⌂</button></div>`}
function startH(part=null){let items=part?H.filter(x=>x[0].startsWith('Teil '+part+' ·')):H;state={module:'Hören',mode:part?'training':'exam',items,idx:0,answers:{},start:Date.now(),timer:null,partFilter:part};run();}
function startL(part=null){let items=[];if(part){let p=L.find(x=>x.p===part);p.qs.forEach((q,i)=>items.push({p,qi:i,q}));}else L.forEach(p=>p.qs.forEach((q,i)=>items.push({p,qi:i,q})));state={module:'Lesen',mode:part?'training':'exam',items,idx:0,answers:{},start:Date.now(),timer:null,partFilter:part};run();}
function run(){clearInterval(state.timer);let total=state.module==='Hören'?40*60:65*60;state.timer=setInterval(()=>{let left=Math.max(0,total-Math.floor((Date.now()-state.start)/1000));let el=document.getElementById('timer');if(el)el.textContent=fmt(left);if(left===0)finish()},1000);renderQ()}
function fmt(s){var m=Math.floor(s/60);var sec=s%60;return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec}
function renderQ(){let it=state.items[state.idx];let n=state.idx+1;let total=state.items.length;let audio='';let q='',opts=[],key='';if(state.module==='Hören'){let [label,a,text,o,k]=it;audio=`<div class="audio"><strong>🎧 ${label}</strong><small>Originale Hörsequenz · Goethe-Institut</small><audio controls preload="none" src="${AUDIO[a]}"></audio></div>`;q=text;opts=o;key=k}else{let {p,q:qq}=it;q=qq[0];opts=qq[1];key=qq[2]};let chosen=state.answers[n]||'';app.innerHTML=top(state.module,state.mode==='exam'?'Prüfung':'Training')+`<div class="wrap"><div class="card"><div style="display:flex;justify-content:space-between"><span class="qnum">Aufgabe ${n} / ${total}</span><span class="timer" id="timer">--:--</span></div><div class="progress"><i style="width:${n/total*100}%"></i></div>${state.module==='Lesen'?`<div class="textblock"><b>${it.p.title}</b><p>${it.p.text}</p></div>`:''}${audio}<div class="qtext">${q}</div>${opts.map(o=>`<label class="option ${chosen===o[1]?'selected':''}"><input type="radio" name="answer" value="${o[1]}" ${chosen===o[1]?'checked':''} onchange="pick('${o[1]}')"> <span>${o[0]}</span></label>`).join('')}<div class="navrow"><button class="btn gray" onclick="prev()" ${n===1?'disabled':''}>← Zurück</button><button class="btn" onclick="${n===total?'finish()':'next()'}">${n===total?'Auswertung':'Weiter →'}</button></div></div><div class="notice">${state.module==='Hören'?'Audio: Goethe-Institut. Fragen und Antworten: eigene Formulierungen.':'Lesetext und Aufgaben: eigene Inhalte auf B1-Niveau im Goethe-orientierten Format.'}</div></div>`}
function pick(v){state.answers[state.idx+1]=v;document.querySelectorAll('.option').forEach(function(x){x.classList.remove('selected')});var el=document.querySelector('input[name=answer][value="'+v+'"]');if(el&&el.parentElement)el.parentElement.classList.add('selected')}
function next(){if(state.idx<state.items.length-1){state.idx++;renderQ()}}function prev(){if(state.idx>0){state.idx--;renderQ()}}
function finish(){clearInterval(state.timer);let score=0;let details=[];if(state.module==='Hören'){state.items.forEach((it,i)=>{let key=it[4],ans=state.answers[i+1]||null;if(ans===key)score++;details.push({n:i+1,q:it[2],ans,key})})}else{state.items.forEach((it,i)=>{let key=it.q[2],ans=state.answers[i+1]||null;if(ans===key)score++;details.push({n:i+1,q:it.q[0],ans,key})})}let total=state.items.length;let rec={module:state.module,score,total,date:Date.now(),details,mode:state.mode};let h=hist();h.unshift(rec);save('b1hist',h.slice(0,30));analysis(rec)}
function analysis(rec){let parts=rec.module==='Hören'?[10,5,7,8]:[6,7,7,6,4];let counts=[],pos=0;parts.forEach((len,i)=>{let s=0;for(let j=0;j<len;j++)if(rec.details[pos+j].ans===rec.details[pos+j].key)s++;counts.push(s);pos+=len});app.innerHTML=top('📊 Ergebnis',rec.module)+`<div class="wrap"><section class="card hero"><div class="resultBig">${rec.score} / ${rec.total}</div><p>${Math.round(rec.score/rec.total*100)}% · ${rec.module}</p></section><section class="card"><b>Ergebnis nach Teil</b>${counts.map((s,i)=>{let max=parts[i];return `<div class="partrow"><span>Teil ${i+1}</span><b>${s}/${max}</b></div><div class="bar"><i style="width:${s/max*100}%"></i></div>`}).join('')}</section><div class="section">Antwortanalyse</div>${rec.details.map(d=>`<div class="card"><div class="qnum">Aufgabe ${d.n}</div><div style="margin:6px 0 8px;font-weight:700">${d.q}</div><div class="answerbox">Deine Antwort: <b>${label(d.ans)||'keine Antwort'}</b><br>Richtige Antwort: <b>${label(d.key)}</b><br><span class="${d.ans===d.key?'correct':'wrong'}">${d.ans===d.key?'✓ Richtig':'✕ Falsch'}</span></div></div>`).join('')}<button class="btn" onclick="${rec.module==='Hören'?'startH()':'startL()'}">🔄 Noch einmal</button></div>`}
function label(v){return v?({'richtig':'Richtig','falsch':'Falsch',a:'A',b:'B',c:'C',r:'Richtig',f:'Falsch'}[v]||v):''}
function results(){let h=hist();app.innerHTML=top('📊 Ergebnisse','Alle gespeicherten Versuche')+`<div class="wrap">${h.length?h.map(x=>`<div class="hist"><div><b>${x.module}</b><br><span class="muted">${new Date(x.date).toLocaleString('de-DE')}</span></div><div><b>${x.score}/${x.total}</b><br><span class="tag">${Math.round(x.score/x.total*100)}%</span></div></div>`).join(''):'<div class="card">Noch keine Ergebnisse.</div>'}<button class="btn secondary" style="margin-top:10px" onclick="save('b1hist',[]);results()">Verlauf löschen</button></div>`}
function training(m){app.innerHTML=top('🎯 '+m+' Training','Teil auswählen')+`<div class="wrap">${(m==='Hören'?[1,2,3,4]:[1,2,3,4,5]).map(p=>`<button class="btn secondary" style="margin-bottom:8px;text-align:left" onclick="${m==='Hören'?`startH(${p})`:`startL(${p})`}">Teil ${p} · Training →</button>`).join('')}<button class="btn gray" onclick="${m==='Hören'?'startH()':'startL()'}">Kompletter Test</button></div>`}
function notes(){let n=load('b1notes','');app.innerHTML=top('📝 Notizen','Bleiben auf diesem Gerät gespeichert')+`<div class="wrap"><textarea class="textarea" id="notes">${n}</textarea><button class="btn" style="margin-top:8px" onclick="save('b1notes',document.getElementById('notes').value);alert('Gespeichert')">Speichern</button></div>`}
try{home()}catch(e){document.getElementById('app').innerHTML='<div class=\"wrap\"><section class=\"card\"><h1>Ошибка запуска</h1><p>Приложение загрузилось, но JavaScript остановился.</p><p style=\"font-size:12px;word-break:break-word\">'+String(e&&e.message?e.message:e)+'</p><button class=\"btn\" onclick=\"location.reload()\">Перезагрузить</button></section></div>'}
</script></body></html>
