<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Deutsch B1 – Hören & Lesen</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#69748a;--line:#e5e9f1;--blue:#3159df;--green:#159447;--red:#d9363e;--soft:#eef2ff}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh}.wrap{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 5px 22px #1720330a}
.hero{text-align:center;padding:28px 18px}.hero .emoji{font-size:42px}.hero h1{margin:8px 0;font-size:29px}.hero p{color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;padding:14px 15px;background:var(--blue);color:#fff;font-weight:800;width:100%;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--blue)}.btn.gray{background:#eef0f4;color:#39445a}
.btn:disabled{opacity:.45}.pillrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.pill{background:#f0f3f8;border-radius:999px;padding:7px 10px;color:#556177;font-size:12px;font-weight:800}
.section{font-weight:850;font-size:16px;margin:18px 2px 9px}.qnum{font-size:12px;color:var(--muted);font-weight:800}.qtext{font-size:18px;font-weight:750;line-height:1.42;margin:7px 0 14px}
.option{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;cursor:pointer;background:#fff}.option input{margin-top:3px}.option.selected{border-color:#91a6ff;background:#f7f8ff}
.audio{background:#f0f3f8;border-radius:14px;padding:12px;margin:10px 0 14px}.audio strong{font-size:13px}.audio small{display:block;color:var(--muted);margin:3px 0 8px}.audio audio{width:100%}
.navrow{display:flex;gap:8px;margin-top:12px}.navrow button{flex:1}.timer{font-weight:850;font-variant-numeric:tabular-nums}.progress{height:6px;background:#e8ebf2;border-radius:99px;overflow:hidden;margin:9px 0 14px}.progress i{display:block;height:100%;background:var(--blue)}
.answerbox{background:#f8f9fc;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.correct{color:var(--green);font-weight:800}.wrong{color:var(--red);font-weight:800}
.muted{color:var(--muted);font-size:12px;line-height:1.45}.resultBig{text-align:center;font-size:42px;font-weight:900}.bar{height:9px;background:#e8ebf2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.partrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.partrow:last-child{border:0}.textblock{line-height:1.65;font-size:15px}.notice{font-size:11px;color:var(--muted);line-height:1.45}
.top{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}.top button{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font-size:20px}.brand{font-weight:850;flex:1}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.hist{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;display:flex;justify-content:space-between;margin-bottom:8px}.tag{font-size:10px;background:#eef2ff;color:var(--blue);padding:4px 7px;border-radius:999px;font-weight:800}
.textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:13px;padding:12px;resize:vertical;background:#fff;color:var(--text)}
.error{padding:14px;background:#fff0f0;color:#8b1e1e;border:1px solid #f0b8b8;border-radius:14px;margin:12px;display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:11px}.qtext{font-size:17px}}
</style>
</head>
<body>
<div id="error" class="error"></div>
<div id="app" class="app">
  <div class="wrap">
    <section class="card hero">
      <div class="emoji">🇩🇪</div>
      <h1>Deutsch B1</h1>
      <p>Hören & Lesen Trainer</p>
    </section>
    <div class="grid">
      <button class="btn" id="hBtn">🎧 HÖREN</button>
      <button class="btn secondary" id="lBtn">📖 LESEN</button>
    </div>
  </div>
</div>
<script src="./app.js" defer></script>
</body>
</html>
